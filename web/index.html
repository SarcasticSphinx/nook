<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Runner</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#e9edf2;--hi:#ffffff;--lo:#c3cad5;--fg:#1e2430;--mute:#8a93a2;--soft:#5b6474;--line:rgba(30,40,60,.08);
  --blue:#1f78ea;--onblue:#fff;--blueglow:rgba(31,120,234,.32);--red:#ec4141;--redglow:rgba(236,65,65,.3);--ok:#2fbf5b;
  --up:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);
  --up-sm:3px 3px 8px var(--lo),-3px -3px 8px var(--hi);
  --in:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
  --term-bg:#ffffff;--term-fg:#26262b;--term-mute:#9a9aa3;
  --nl:40%;--ns:38%;--al:86%;--as:40%;--at:34%;
  --r:22px;--spring:cubic-bezier(.2,.9,.3,1.08);--ease:cubic-bezier(.3,.7,.2,1)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#23272e;--hi:#2d323a;--lo:#181b20;--fg:#e7eaef;--mute:#8790a0;--soft:#a9b1bf;--line:rgba(255,255,255,.06);
  --blue:#2b84f3;--blueglow:rgba(43,132,243,.28);--red:#e5484d;--redglow:rgba(229,72,77,.28);--ok:#35c463;
  --term-bg:#111113;--term-fg:#d2d2d6;--term-mute:#6d6d76;
  --nl:70%;--ns:40%;--al:30%;--as:22%;--at:78%
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.ic{display:inline-flex;width:20px;height:20px;flex:none}.ic svg{width:100%;height:100%}
.logo{display:block;height:22px;width:auto;color:var(--fg)}.logo path{fill:currentColor}
body.term #app,body.chat #term,body.dec #app,body.dec #term,body.dec #modal,body.dec #welcome{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mute) 30%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- terminal look ---------- */
#term{display:flex;flex-direction:column;height:100%;background:var(--term-bg);color:var(--term-fg);font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
#tlog{flex:1;overflow-y:auto;padding:12px 16px 4px}
#tlog .l{display:flex;gap:1ch}
#tlog .h{flex:none;color:var(--term-mute);white-space:pre}
#tlog .t{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
#tlog .o .t,#tlog .s .t,#tlog .top{color:var(--term-mute)}
#tlog .top{text-align:center;padding:4px 0 10px}
#tlog .n .t{color:#b9924a;font-style:italic}
#tlog .dm .h{color:#9a7fb5}
#tlog .raw .t{white-space:pre-wrap;color:var(--term-mute)}
#tlog .raw .k{color:#4f9aa8}#tlog .raw .hd{color:#b9924a;font-weight:700}
#tlog a{color:#4f8f68;text-decoration:none;font-weight:600;cursor:pointer}
#tsug{padding:0 16px;color:var(--term-mute);white-space:pre;overflow:hidden;min-height:0}
#tbar{display:flex;padding:4px 16px 12px}
#tprompt{flex:none;color:var(--term-mute);white-space:pre}
#tin{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:inherit;padding:0;margin:0}
body.g #term,body.g #main{opacity:.3}

/* ---------- chat look: soft raised surfaces ---------- */
#app{display:flex;height:calc(100% - 32px);height:calc(100dvh - 32px);margin:16px;border-radius:32px;background:var(--bg);box-shadow:var(--up);overflow:hidden}
#side{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;position:relative}
#side::after{content:"";position:absolute;top:18px;bottom:18px;right:0;width:2px;border-radius:2px;box-shadow:inset 1px 0 0 var(--lo),inset -1px 0 0 var(--hi)}
.stop{display:flex;align-items:center;gap:10px;padding:22px 20px 14px 24px}
.stop .logo{flex:1;max-width:96px}
.ib{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--soft);background:var(--bg);box-shadow:var(--up-sm);transition:box-shadow .2s,color .2s,transform .15s var(--spring);flex:none}
.ib:hover{color:var(--fg)}.ib:active{box-shadow:var(--in);transform:scale(.95)}
.stop .sp{flex:1}
.tabs{position:relative;display:flex;margin:4px 18px 12px;padding:5px;border-radius:999px;box-shadow:var(--in)}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--bg);box-shadow:var(--up-sm);transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1);pointer-events:none}
.tab{position:relative;z-index:1;flex:1;height:38px;border-radius:999px;color:var(--mute);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .3s var(--ease),transform .15s var(--spring)}
.tab.on{color:var(--fg)}
.tab:active{transform:scale(.95)}
.tab .cnt[hidden]{display:none}
.tab .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 8px var(--redglow);animation:popin .35s var(--spring)}
.find{margin:0 18px 10px;display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 16px;height:42px;color:var(--mute);box-shadow:var(--in)}
.find input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
#active{display:flex;gap:10px;overflow-x:auto;padding:8px 20px 12px;scrollbar-width:none}#active::-webkit-scrollbar{display:none}
.act{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--soft);cursor:pointer;animation:rise .35s var(--spring) both}
.act span:last-child{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chats{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 14px;min-height:0}
.empty{padding:30px 10px;text-align:center;color:var(--mute);font-size:14px}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0 0 6px;border-radius:22px;cursor:pointer;transition:box-shadow .25s var(--ease),transform .2s var(--spring);user-select:none}
#chats.out-l{animation:outL .14s ease-in both}#chats.out-r{animation:outR .14s ease-in both}
#chats.in-l .row,#chats.in-l .empty{animation:inL .45s var(--spring) both}
#chats.in-r .row,#chats.in-r .empty{animation:inR .45s var(--spring) both}
@keyframes outL{to{opacity:0;transform:translateX(-22px)}}
@keyframes outR{to{opacity:0;transform:translateX(22px)}}
@keyframes inL{from{opacity:0;transform:translateX(-30px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(30px) scale(.98)}to{opacity:1;transform:none}}
.row:hover{box-shadow:var(--up-sm)}.row:active{transform:scale(.985)}
.row.on{box-shadow:var(--up)}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pre{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row.un .pre{color:var(--soft);font-weight:600}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--mute)}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:9px;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 10px var(--redglow);animation:popin .35s var(--spring)}
.badge.at{background:var(--blue);box-shadow:0 4px 10px var(--blueglow);border-radius:999px;padding:0 9px}
.av{position:relative;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;background:hsl(var(--h),var(--as),var(--al));color:hsl(var(--h),var(--ns),var(--at));border:3px solid var(--bg);box-shadow:var(--up-sm);transition:transform .2s var(--spring);user-select:none}
.av.sq{border-radius:17px;font-size:20px}
.av.sm{width:32px;height:32px;font-size:13px;border-width:2px}.av.sm.sq{border-radius:11px}
.av.xl{width:84px;height:84px;font-size:32px;border-width:4px}.av.xl.sq{border-radius:28px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid var(--bg)}
#meBox{display:flex;align-items:center;gap:12px;padding:14px 18px 18px 22px}
#meBox .mid{flex:1;min-width:0}#meBox .nm{font-weight:650}#meBox .st{font-size:12px;color:var(--mute)}
#meBox input{width:100%;border:0;outline:0;background:transparent;border-radius:12px;padding:6px 10px;font-weight:650;box-shadow:var(--in)}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px 14px 24px;min-height:78px;position:relative;z-index:2}
header::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:2px;box-shadow:inset 0 1px 0 var(--lo),inset 0 -1px 0 var(--hi)}
header .tt{flex:1;min-width:0}
#title{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12.5px;color:var(--mute)}
#sub.on{color:var(--ok)}
#backBtn{display:none}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 26px 14px;overscroll-behavior:contain}
#msgs.swap{animation:fade .28s var(--ease)}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 10px 18px;color:var(--mute);font-size:13.5px;animation:fade .4s}
.intro b{color:var(--fg);font-size:18px}
.spin{width:24px;height:24px;margin:18px auto;border-radius:50%;border:3px solid var(--lo);border-top-color:var(--blue);animation:spin .8s linear infinite}
.day{text-align:center;font-size:12px;font-weight:600;color:var(--mute);margin:18px 0 8px}
.grp{display:flex;gap:10px;margin-top:14px;align-items:flex-end}
.grp.me{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:6px;max-width:min(72%,620px);min-width:0}
.grp.me .col{align-items:flex-end}
.who{font-size:13px;color:var(--mute);padding:0 6px 1px;display:flex;gap:8px;align-items:baseline}
.who .nm{font-weight:600;color:hsl(var(--h),var(--ns),var(--nl))}
.grp.me .who .nm{color:var(--soft)}
.b{background:var(--bg);box-shadow:var(--up-sm);padding:10px 16px;border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;width:fit-content;transform-origin:bottom left;font-size:15.5px}
.them .b+.b{border-top-left-radius:8px}.them .b:not(:last-child){border-bottom-left-radius:8px}
.grp.me .b{background:var(--blue);color:var(--onblue);box-shadow:0 6px 16px var(--blueglow);transform-origin:bottom right}
.me .b+.b{border-top-right-radius:8px}.me .b:not(:last-child){border-bottom-right-radius:8px}
.b.new{animation:rise .38s var(--spring)}
.b .at{font-weight:650;color:var(--blue)}
.b .at.you{background:color-mix(in srgb,var(--blue) 15%,transparent);border-radius:7px;padding:0 4px}
.grp.me .b .at{color:inherit;background:rgba(255,255,255,.2);border-radius:7px;padding:0 4px}
.b.ment{box-shadow:var(--up-sm),inset 3px 0 0 var(--blue)}
#tlog .mn .t{color:#4f7fc0}
.b.emoji{background:none!important;box-shadow:none!important;font-size:38px;line-height:1.15;padding:2px 4px}
.b.file{padding:8px;min-width:250px}
.frow{display:flex;align-items:center;gap:12px;padding:4px 6px 4px 4px}
.fi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;box-shadow:var(--in)}
.me .fi{box-shadow:none;background:rgba(255,255,255,.18)}
.fmeta{flex:1;min-width:0}.fn{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fs{font-size:12px;opacity:.75}
.fa{display:flex;gap:8px}
.fb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:inherit;background:var(--bg);box-shadow:var(--up-sm);transition:transform .15s var(--spring)}
.me .fb{background:rgba(255,255,255,.18);box-shadow:none}
.fb:hover{transform:scale(1.08)}.fb .ic{width:18px;height:18px}
.pv{display:block;max-width:100%;max-height:300px;border-radius:16px;cursor:zoom-in;margin-bottom:6px;animation:fade .3s}
.bar{height:6px;border-radius:6px;box-shadow:var(--in);margin:8px 6px 4px;overflow:hidden}
.me .bar{box-shadow:none;background:rgba(255,255,255,.25)}
.fill{height:100%;width:0;background:currentColor;border-radius:6px;transition:width .25s var(--ease)}
.cap{padding:4px 8px 2px}
.sys{align-self:center;margin:14px auto;width:fit-content;max-width:90%;text-align:center;font-size:12.5px;color:var(--mute);animation:fade .3s}
.sys.note{color:var(--soft);font-weight:600}
.card{margin:16px auto;max-width:560px;border-radius:24px;padding:16px 20px 12px;box-shadow:var(--up);animation:rise .35s var(--spring);font-size:14px}
.card h4{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card h4:first-child{margin-top:0}
.card .r{display:flex;gap:12px;padding:4px 0;align-items:baseline}
.card .r code{flex:none;min-width:118px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--blue);cursor:pointer}
.card .r span{color:var(--soft)}
.card .p{padding:3px 0;color:var(--soft);white-space:pre-wrap}
#typing{height:0;overflow:hidden;padding:0 26px;transition:height .25s var(--ease)}
#typing.on{height:52px}
.tb{display:inline-flex;align-items:center;gap:10px}
.tb .dots{display:inline-flex;gap:4px;padding:13px 15px;border-radius:var(--r);box-shadow:var(--up-sm)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bounce 1.3s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
#composer{display:flex;align-items:flex-end;gap:12px;padding:10px 22px calc(18px + env(safe-area-inset-bottom));position:relative}
.cbox{flex:1;display:flex;align-items:flex-end;border-radius:26px;padding:2px 8px 2px 18px;box-shadow:var(--in);min-width:0}
#cin{flex:1;resize:none;border:0;outline:0;background:transparent;max-height:170px;padding:12px 0;line-height:1.4;font-size:15.5px;min-width:0}
#sendBtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--onblue);background:var(--blue);box-shadow:0 6px 14px var(--blueglow);opacity:.45;transform:scale(.92);transition:transform .25s var(--spring),opacity .2s;flex:none}
#sendBtn.ready{opacity:1;transform:scale(1)}
#sendBtn:active{transform:scale(.9)}
#attachBtn{width:46px;height:46px}
#sugg{position:absolute;left:22px;right:22px;bottom:calc(100% - 2px);background:var(--bg);border-radius:22px;box-shadow:var(--up);padding:8px;max-height:280px;overflow-y:auto;display:none;transform-origin:bottom center;animation:rise .2s var(--spring);z-index:5}
#sugg.on{display:block}
.sg{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;cursor:pointer}
.sg code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--blue);min-width:110px}
.sg span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg.sel{box-shadow:var(--in)}
.sg .nm{font-weight:600;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#jump{position:absolute;right:28px;bottom:98px;width:42px;height:42px;border-radius:50%;background:var(--bg);box-shadow:var(--up);display:grid;place-items:center;color:var(--soft);transform:scale(0);transition:transform .25s var(--spring);z-index:3}
#jump.on{transform:scale(1)}
#drop{position:fixed;inset:22px;border:2px dashed var(--mute);border-radius:32px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;place-items:center;font-size:19px;font-weight:600;color:var(--soft);z-index:30;pointer-events:none}
body.drag #drop{display:grid;animation:fade .15s}
#modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;z-index:40;padding:18px;animation:fade .2s}
#modal.on{display:grid}
.sheet{background:var(--bg);border-radius:30px;box-shadow:var(--up);width:min(900px,100%);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;animation:rise .32s var(--spring)}
.sheet.fit{height:auto;max-height:min(86vh,900px)}
.sheet.small{width:min(400px,100%);height:auto}
.sh{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 24px;position:relative}
.sh .tt{flex:1;min-width:0}.sh .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sh .tt span{font-size:12.5px;color:var(--mute)}
.sb{overflow:auto;flex:1;min-height:0;margin:0 14px 14px;border-radius:20px;box-shadow:var(--in)}
.sb img{display:block;max-width:100%;max-height:74vh;margin:0 auto}
.sb iframe{display:block;width:100%;height:100%;border:0;border-radius:20px;background:#fff}
.sb pre{margin:0;padding:16px 20px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
.sb .msg{padding:40px 20px;text-align:center;color:var(--mute)}.sb .msg a{color:var(--blue)}
.ask{padding:22px}.ask b{display:block;font-size:17px;margin-bottom:14px}
.ask input{width:100%;height:48px;border:0;outline:0;border-radius:16px;background:transparent;padding:0 16px;font-size:16px;box-shadow:var(--in)}
.btns{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.btn{height:42px;padding:0 20px;border-radius:999px;font-weight:650;background:var(--bg);box-shadow:var(--up-sm);transition:transform .15s var(--spring)}
.btn.pri{background:var(--blue);color:var(--onblue);box-shadow:0 6px 14px var(--blueglow)}
.btn:active{transform:scale(.95)}
#welcome{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:35;padding:20px}
#welcome.on{display:grid}
.wl{width:min(380px,100%);text-align:center;animation:rise .5s var(--spring)}
.wl .logo{height:54px;margin:0 auto 14px}
.wl p{color:var(--mute);margin:0 0 24px}
.wl input{width:100%;height:54px;border:0;outline:0;border-radius:20px;background:transparent;padding:0 18px;font-size:17px;text-align:center;box-shadow:var(--in)}
.wl .btn{width:100%;height:52px;margin-top:16px;font-size:16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;pointer-events:none;transition:opacity .25s,transform .3s var(--spring);z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  #app{margin:0;border-radius:0;height:100%;height:100dvh;box-shadow:none}
  #side{width:100%}#side::after{display:none}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .34s var(--ease)}
  body.inchat #main{transform:none}
  #backBtn{display:inline-grid}
  header{padding-left:12px;min-height:70px}
  #msgs{padding:8px 14px 10px}
  .col{max-width:84%}
  .b.file{min-width:0;width:100%}
  #composer{padding-left:12px;padding-right:12px;gap:8px}
  #jump{bottom:90px;right:16px}
  .card .r{flex-direction:column;gap:0}
}
/* ---------- Esc: a little game instead of the chat ---------- */

  $('hideBtn').onclick = function () { decoy(true); };
  $('whoBtn').onclick = function () { who(S.target.charAt(0) === '#' ? S.target : ''); };
  $('newRoom').onclick = function () { ask('New room', 'room name', '', function (n) { if (cleanRoom(n)) joinRoom(cleanRoom(n)); }); };
  document.addEventListener('click', function (e) {
    if (body.classList.contains('dec') || window.getSelection().toString()) return;
    if (S.mode === 'term') $('tin').focus();
  });

  // ---- Esc: an original little runner game instead of the chat ----
  // A pixel cat hops over boxes and ducks under paper planes. Space or Up
  // (or a tap) jumps, Down ducks, Esc goes back to the chat.
  var game = (function () {
    var cv = $('game'), cx = cv.getContext('2d'), W = 0, H = 0, raf = 0, last = 0, P = 3;
    var CAT_A = [
      '..............x...x.',
      '..............xx.xx.',
      '..............xxxxx.',
      'x.............x.x.xx',
      'x.............xxxxx.',
      '.x....xxxxxxxxxxxx..',
      '.x...xxxxxxxxxxxxx..',
      '..x.xxxxxxxxxxxxxx..',
      '...xxxxxxxxxxxxxx...',
      '....xxxxxxxxxxxxx...',
      '....xx.xx....xx.xx..',
      '....x...x....x...x..'
    ];
    var CAT_B = CAT_A.slice(0, 10).concat([
      '.....xx.xx..xx.xx...',
      '.....x...x..x...x...'
    ]);
    var DUCK = [
      '................x...x.',
      '................xx.xx.',
      'x.....xxxxxxxxxxxxxxx.',
      '.x..xxxxxxxxxxxxx.x.xx',
      '..xxxxxxxxxxxxxxxxxxx.',
      '...xxxxxxxxxxxxxxxx...',
      '...xx.xx......xx.xx...'
    ];
    var PLANE = [
      'xx..........',
      'xxxx........',
      '.xxxxxxx....',
      '..xxxxxxxxxx',
      '..xxxxxxx...',
      '.xxx........'
    ];
    var g = { on: false, play: false, over: false, x: 0, y: 0, vy: 0, duck: false, speed: 0, dist: 0, obs: [], gap: 0, hi: Number(store('hi')) || 0, stones: [], clouds: [] };
    var dark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function ink() { return dark && dark.matches ? '#c4cad3' : '#50555e'; }
    function faint() { return dark && dark.matches ? '#3a3f47' : '#d9dce1'; }
    function paper() { return dark && dark.matches ? '#1c1f24' : '#f6f7f9'; }
    function ground() { return Math.round(H * 0.62); }
    function size() {
      var d = window.devicePixelRatio || 1;
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * d; cv.height = H * d;
      cx.setTransform(d, 0, 0, d, 0, 0);
      P = W < 600 ? 2 : 3;
      document.documentElement.style.setProperty('--gbg', paper());
    }
    function sprite(rows, x, y, color) {
      cx.fillStyle = color;
      for (var r = 0; r < rows.length; r++)
        for (var c = 0; c < rows[r].length; c++)
          if (rows[r].charAt(c) === 'x') cx.fillRect(Math.round(x + c * P), Math.round(y + r * P), P, P);
    }
    function reset() {
      g.play = true; g.over = false; g.y = 0; g.vy = 0; g.duck = false; g.speed = 330; g.dist = 0; g.obs = []; g.gap = 420;
    }
    function jump() {
      if (!g.play || g.over) { reset(); return; }
      if (g.y === 0) g.vy = -760;
    }
    function spawn() {
      var t = Math.random(), o;
      if (g.speed > 470 && t < 0.25) {
        o = { kind: 'plane', w: 12 * P, h: 6 * P, lift: [10, 26, 50][Math.floor(Math.random() * 3)] * P / 3 * 1.6 };
      } else {
        var n = 1 + Math.floor(Math.random() * (g.speed > 420 ? 3 : 2)), tall = Math.random() < 0.3;
        o = { kind: 'box', w: n * 8 * P, h: (tall ? 12 : 8) * P, n: n };
      }
      o.x = W + 20;
      g.obs.push(o);
      g.gap = 260 + Math.random() * 380 + g.speed * 0.5;
    }
    function hit(o) {
      var cw = (g.duck ? 22 : 20) * P, ch = (g.duck ? 7 : 12) * P;
      var ax = g.x + P * 2, ay = ground() - ch - g.y + P, aw = cw - P * 4, ah = ch - P * 2;
      var oy = o.kind === 'plane' ? ground() - o.h - o.lift : ground() - o.h;
      return ax < o.x + o.w - P && ax + aw > o.x + P && ay < oy + o.h - P && ay + ah > oy + P;
    }
    function step(dt) {
      if (!g.play || g.over) return;
      g.speed = Math.min(820, g.speed + 9 * dt);
      g.dist += g.speed * dt;
      g.vy += (g.duck && g.y > 0 ? 5200 : 2500) * dt;
      g.y = Math.max(0, g.y - g.vy * dt);
      if (g.y === 0 && g.vy > 0) g.vy = 0;
      g.gap -= g.speed * dt;
      if (g.gap <= 0) spawn();
      for (var i = g.obs.length - 1; i >= 0; i--) {
        var o = g.obs[i];
        o.x -= g.speed * dt * (o.kind === 'plane' ? 1.12 : 1);
        if (o.x + o.w < -20) g.obs.splice(i, 1);
        else if (hit(o)) {
          g.over = true;
          var sc = Math.floor(g.dist / 12);
          if (sc > g.hi) { g.hi = sc; store('hi', String(sc)); }
        }
      }
      g.stones.forEach(function (s) { s.x -= g.speed * dt; if (s.x < -10) { s.x = W + Math.random() * 60; s.y = Math.random() * 16; } });
      g.clouds.forEach(function (c) { c.x -= g.speed * dt * 0.12; if (c.x < -80) { c.x = W + Math.random() * 200; c.y = 40 + Math.random() * H * 0.3; } });
    }
    function pad5(n) { return ('00000' + n).slice(-5); }
    function draw() {
      var gy = ground(), inkc = ink();
      cx.fillStyle = paper(); cx.fillRect(0, 0, W, H);
      cx.fillStyle = faint();
      g.clouds.forEach(function (c) { cx.fillRect(c.x, c.y, 46, 6); cx.fillRect(c.x + 10, c.y - 6, 26, 6); });
      cx.fillStyle = inkc;
      cx.fillRect(0, gy, W, 2);
      g.stones.forEach(function (s) { cx.fillRect(s.x, gy + 6 + s.y, s.w, 2); });
      g.obs.forEach(function (o) {
        if (o.kind === 'plane') { sprite(PLANE, o.x, gy - o.h - o.lift, inkc); return; }
        for (var k = 0; k < o.n; k++) {
          var bx = o.x + k * 8 * P, bw = 8 * P - 2, by = gy - o.h;
          cx.strokeStyle = inkc; cx.lineWidth = 2;
          cx.strokeRect(bx + 1, by + 1, bw - 2, o.h - 2);
          cx.beginPath(); cx.moveTo(bx + 1, by + 1); cx.lineTo(bx + bw - 1, gy - 1); cx.moveTo(bx + bw - 1, by + 1); cx.lineTo(bx + 1, gy - 1); cx.stroke();
        }
      });
      var legs = Math.floor(g.dist / 40) % 2 && g.y === 0 && g.play && !g.over;
      var cat = g.duck && g.y === 0 ? DUCK : legs ? CAT_B : CAT_A;
      sprite(cat, g.x, gy - cat.length * P - g.y, inkc);
      cx.fillStyle = inkc;
      cx.font = '600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
      cx.textAlign = 'right';
      cx.fillText((g.hi ? 'BEST ' + pad5(g.hi) + '   ' : '') + pad5(Math.floor(g.dist / 12)), W - 24, 36);
      cx.textAlign = 'center';
      if (!g.play) cx.fillText('press space to play', W / 2, gy + 60);
      else if (g.over) { cx.font = '700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'; cx.fillText('oops', W / 2, gy - 150); cx.font = '600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'; cx.fillText('space to try again', W / 2, gy - 124); }
    }
    function loop(t) {
      if (!g.on) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000);
      last = t;
      step(dt); draw();
      raf = requestAnimationFrame(loop);
    }
    function show(on) {
      g.on = on;
      cancelAnimationFrame(raf); last = 0;
      if (!on) return;
      size();
      g.x = Math.max(24, W * 0.08);
      if (!g.stones.length) for (var i = 0; i < 26; i++) g.stones.push({ x: Math.random() * W, y: Math.random() * 16, w: 2 + Math.floor(Math.random() * 6) });
      if (!g.clouds.length) for (var j = 0; j < 4; j++) g.clouds.push({ x: Math.random() * W, y: 40 + Math.random() * H * 0.3 });
      raf = requestAnimationFrame(loop);
    }
    window.addEventListener('resize', function () { if (g.on) size(); });
    if (dark && dark.addEventListener) dark.addEventListener('change', function () { if (g.on) size(); });
    document.addEventListener('keydown', function (e) {
      if (!g.on) return;
      if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); jump(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); g.duck = true; }
    });
    document.addEventListener('keyup', function (e) { if (g.on && e.key === 'ArrowDown') g.duck = false; });
    var hold = 0; // phones have no Esc: holding a finger on the game goes back
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); clearTimeout(hold); hold = setTimeout(function () { decoy(false); }, 900); });
    cv.addEventListener('pointerup', function () { clearTimeout(hold); });
    cv.addEventListener('pointercancel', function () { clearTimeout(hold); });
    return { show: show };
  })();

  body.classList.remove('chat', 'term'); body.classList.add(S.mode);
  if (window.innerWidth > 760) body.classList.add('inchat');
  view().all(); side(); moveInd(true);
  if (!S.nick) welcome(); else connect();
  view().focus();
})();
</script>
</body>
</html>
